  <rect x="580" y="512" width="82" height="36" rx="18" fill="#c9b896" stroke="#101418" stroke-opacity="0.15"/>
  <!-- тіло -->
  <path d="M 285 335 Q 400 282 515 335 L 545 470 L 540 815 Q 400 855 260 815 L 255 470 Z" fill="url(#bodyG)"/>
