  <path d="M 428 300 L 436 505" stroke="#d9f24b" stroke-width="7" stroke-linecap="round"/>
  <circle cx="362" cy="513" r="9" fill="#d9f24b"/>
  <circle cx="438" cy="513" r="9" fill="#d9f24b"/>
